# A complete, working example: every block is present and loads as is
# (`java -jar RssNewsBot.jar --check-config config.example.yaml`). Optional features ship with
# `enabled: false`; switch one on by flipping that line. Details: README → Feature overview /
# Configuration reference.

telegram:
  botToken: "YOUR_TELEGRAM_BOT_TOKEN"   # env TELEGRAM_BOT_TOKEN wins
  # getUpdates loop: reactions (/status "Reactions (7d)"), admin commands and buttons. One consumer
  # per bot token: never on two instances sharing a token (HTTP 409). Bot must be a channel admin.
  updatesPolling: false

openai:
  apiKey: "YOUR_OPENAI_API_KEY"         # env OPENAI_API_KEY wins
  model: "gpt-5-mini-2025-08-07"
  batchModel: "gpt-5-mini-2025-08-07"

# ── OpenRouter ─────────────────────────────────────────────────── (optional provider)
# Present = the default for sync summarize / render, and every 2nd Step 1 request (A/B).
# No Batch API: batch always stays on `openai:`.
openrouter:
  apiKey: "YOUR_OPENROUTER_API_KEY"     # env OPENROUTER_API_KEY wins
  model: "provider/your-free-model"
  models: []                            # failover ladder, REPLACES model when set (max 4), e.g.
                                        # [nvidia/nemotron-3-ultra-550b-a55b:free, minimax/minimax-m3:free]
  baseUrl: "https://openrouter.ai/api/v1"
  httpReferer: "https://github.com/your/repo"   # attribution header
  xTitle: "RssNewsBot"                          # attribution header

# ── Anthropic ──────────────────────────────────────────────────── (optional provider)
# Present = `provider: anthropic` in any llm.* slot (batch included: native Message Batches API)
# and `summarize: anthropic` on feeds.
anthropic:
  apiKey: "YOUR_ANTHROPIC_API_KEY"      # env ANTHROPIC_API_KEY wins
  model: "claude-sonnet-4-6"            # sync model
  batchModel: "claude-sonnet-4-6"       # default: model
  baseUrl: "https://api.anthropic.com/v1"
  anthropicVersion: "2023-06-01"
  maxTokens: 4096                       # output cap per request

# ── Claude CLI / Codex CLI ─────────────────────────────────────── (optional providers)
# `claude -p` / `codex exec` on this machine, authenticated by its own login (no apiKey). Used only
# where a category or feed names `claudecli` / `codexcli` (sync slots only, no Batch API).
claudeCli:
  command: "claude"                     # executable name (on PATH) or absolute path
  model: ""                             # "" = the CLI's default model; e.g. "claude-sonnet-4-6"
  timeoutSeconds: 300                   # force-kill ceiling per invocation
codexCli:
  command: "codex"
  model: ""                             # "" = the CLI's default model; e.g. "gpt-5-codex"
  timeoutSeconds: 300

# ── CLI login health ─────────────────────────────────────────────
# Alerts in admin.statusChatId when `claude` / `codex` loses its login, hits a usage limit or loses
# its model, and when it recovers; /status `CLI:` line. Needs admin.statusChatId.
health:
  enabled: false
  cliProbe:
    enabled: true                       # (with health.enabled) ping a CLI idle this long:
    intervalHours: 6
    timeoutSeconds: 60                  # 5..600
    claudeModel: ""                     # "" = claudeCli.model
    codexModel: ""                      # "" = codexCli.model
  claudeTokenExpires: null              # only for a `claude setup-token` login, e.g. "2027-08-01"
  warnDaysBefore: 14                    # daily warning this many days before that date

# ── Feed health ──────────────────────────────────────────────────
# Per-feed quality in /status (📡 Feeds, anomalies only): 💀 dead · 💤 nothing new · 🗑 noisy ·
# 🪞 mirror · ⭐ first source. Hints only, no feed is ever disabled. Full table: bench/db-audit/report.mjs.
feedHealth:
  enabled: false
  windowDays: 14                        # by fetched_at; max 30
  statusSection: true
  thresholds:
    deadDays: 3                         # 💀 no successful fetch this long…
    deadFailStreak: 10                  #    …or this many failed passes in a row
    staleNewDays: 14                    # 💤 nothing new this long
    noisyMinArticles: 30                # 🗑 at least this many articles,
    noisyMaxPublishedPct: 2             #    under this % published,
    noisyMinJunkPct: 80                 #    over this % junk
    minPublishedForFirst: 5             # 🪞 / ⭐ only for feeds with this many published stories
    mirrorMaxFirstPct: 10               # 🪞 first in under this %
    primaryMinFirstPct: 50              # ⭐ first in at least this %
  candidates:                           # candidate NEW feeds for the report; independent of
    enabled: false                      # feedHealth.enabled; the bot never adds a feed
    everyDays: 7
    maxProbesPerRun: 10                 # hosts probed per run (1..50)
    maxRequestsPerRun: 40               # HTTP requests per run (1..200)
    minPublished: 3                     # published links from the domain in windowDays
    recheckDays: 30
    ignoreDomains: [youtube.com, youtu.be, x.com, twitter.com, reddit.com, redd.it, t.me, wikipedia.org,
                    github.com, bsky.app, instagram.com, facebook.com, tiktok.com, store.steampowered.com,
                    steamcommunity.com, news.ycombinator.com]

# ── Story clusters ───────────────────────────────────────────────
# Records which articles the dedup folded into which event; nothing in the channel changes.
# post.storyLines and weekly showOutlets / sourceLeaderboard / barometer read it — switch it on
# weeks before them.
storyIntel:
  enabled: false
  retentionDays: 180                    # event_articles; >= weekly.lookbackDays
  historyRetentionDays: 1095            # event_history (🌀 vaporware, barometer)
  domainAliases: {}                     # sister sites counted as one outlet, e.g. { eurogamer.de: eurogamer.net }

database:
  path: "news.db"

scheduler:
  intervalMinutes: 10                   # default digest cadence per category + the maintenance/status tick
  perCategory: true                     # false = legacy single global cycle that waits for the slowest category

# ── RSS fetch stage ──────────────────────────────────────────────
# All feeds go through one shared bounded queue.
fetcher:
  maxConcurrentFetches: 3               # simultaneous HTTP requests across ALL categories
  maxAttempts: 3                        # tries per feed per run
  retryDelaySeconds: 15                 # before a retry; a server Retry-After wins
  fetchDeadlineSeconds: 240             # budget for one run's fetch stage; stragglers wait for the next run
  intervalMinutes: null                 # e.g. 10: ingestion on its own timer, digest run = Step 1 + 2 only;
                                        # null = ingestion inside the digest run
  scrubRulesFile: null                  # e.g. scrub-rules.yaml (copy scrub-rules.example.yaml): site-chrome
                                        # patterns removed from article text; null = nothing is scrubbed
  pathScopedThrottleHosts: []           # converter hosts throttled per route, e.g. ["192.168.77.7:1200"] (RSSHub)
  privateHostAllowlist: []              # extra LAN hosts the SSRF guard allows, e.g. ["nas.lan"];
                                        # feed hosts are trusted automatically
  summarizeInputChars: 12000            # article text a feed's `summarize:` model reads (min 1500);
                                        # the stored description and Step 1 keep 1500

processing:
  staleTimeoutHours: 3
  minArticles: 15
  # Render routing by pending batches per category: < primaryMaxPending → Batch API (llm.batch);
  # then llm.batchFallback (sync) for secondaryMaxPending more; then sync render (llm.render).
  primaryMaxPending: 2                  # 0 = render Batch API off (always sync)
  secondaryMaxPending: 1
  shadowRetentionDays: 30               # llm.shadow pairs in shadow_runs
  maxConcurrentCategories: 12           # scheduler.perCategory: false only: categories run at once
  categoryDeadlineMinutes: 0            # scheduler.perCategory: false only: 0 = wait for every category

# ── 🧐 Fact-check of sent posts ──────────────────────────────────
# A judge model compares a sample of sent posts with the sources the render saw. Log-only:
# fact_checks table + a /status line. Review: bench/factcheck-dump.mjs.
factCheck:
  enabled: false
  sampleRate: 0.2                       # share of sent posts checked
  categories: []                        # empty = every category
  judge:                                # multilingual (posts Ukrainian, sources English)
    provider: openrouter
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    fallback: { provider: codexcli, model: gpt-5.4-mini }
  promptFile: null                      # null = built-in prompt; e.g. "prompts/factcheck.yaml" (copy prompts/factcheck.example.yaml)
  alert:                                # ⚠️ in /status when, over windowDays…
    windowDays: 7
    minChecks: 10                       # …at least this many checks…
    maxUnsupportedRate: 0.15            # …have more than this share unsupported
  retentionDays: 90
  queueSize: 32                         # checks waiting for the judge; more are dropped

# Previous digests injected as context so the LLM skips already-covered news.
summaryHistory:
  maxCount: 3
  retentionDays: 14

# ── Retention archive ────────────────────────────────────────────
# Rows past retention are copied to per-period SQLite files (archive/news-archive-2026-09.db) before
# deletion. Off = plain DELETE. Run one manual VACUUM on news.db after the first archiving pass.
archive:
  enabled: false
  dir: "archive"                        # relative = next to the database file; LOCAL disk
  rotation: monthly                     # monthly | quarterly | yearly
  embeddings: labelled                  # all (~450 MB/month) | labelled (~250 MB/month) | none
  tables: [article_embeddings, event_embeddings, rejected_events, covered_events,
           llm_calls, summaries, digest_messages, reaction_counts]
  keepFiles: 0                          # archive files kept, oldest removed first; 0 = all
  minFreeDiskMb: 2048                   # below this: warn and plain DELETE

# ── Weekly roundup ───────────────────────────────────────────────
# Once a week, the most-repeated stories of each category (events, or articles for a category
# without dedup:) → the render LLM → one post in the category's channel.
weekly:
  enabled: false
  dayOfWeek: SUNDAY                     # MONDAY..SUNDAY
  time: "18:00"                         # 24h HH:mm, bot's local zone
  lookbackDays: 7
  topN: 5                               # stories in the roundup
  candidatePoolSize: 15                 # top clusters handed to the LLM (>= topN)
  articleCandidatePoolSize: 40          # same for the article fallback (>= topN)
  minMentions: 2                        # sightings a story needs (else top by newsworthiness)
  clusterThreshold: 0.83                # cosine that merges two phrasings into one story
  embeddingModel: "text-embedding-3-small"
  maxEvents: 1000                       # rows scanned per category per run
  showMentions: true                    # "🔁 N" per bullet
  showOutlets: false                    # needs storyIntel: "📢 N видань · M першоджерел" instead of 🔁 N
  hashtag: "#головне"                   # last line of the post; null = none
  categories: []                        # empty = every category with a dedup: block
  promptFile: null                      # null = built-in prompts; e.g. "prompts/weekly.yaml" (keys weekly.system / weekly.user)
  prompts:                              # inline text beats promptFile; "" = not set
    system: ""
    user: ""
  # 🥇 Хто пише першим (30 дн.): a.com — 12 з 20 · …   (needs storyIntel)
  sourceLeaderboard:
    enabled: false
    lookbackDays: 30
    minEvents: 10                       # stories an outlet needs to be ranked
    top: 3
    showCopiers: false                  # also name the outlets most often behind (reputational call)
  # Industry barometer: layoffs & closures vs release news per week (needs storyIntel)
  barometer:
    enabled: false
    categories: [gaming]                # empty = every roundup category
    weeks: 12
    minWeeks: 4                         # nothing until the history spans this many weeks
    format: text                        # text = sparkline in the post; png = chart photo
    series:                             # one or two
      - id: layoffs
        label: "Звільнення і закриття"
        eventTypes: [layoffs, studio_closure]
        keywords: [звільн, скорочення штату, скорочення співробітників, закриття студії,
                   layoff, laid off, job cuts, studio closure]
      - id: releases
        label: "Новини про релізи"
        eventTypes: [release_date, delay]
        byEventDate: false              # true = by the release's own date (sparse)
  # Album of the stories' pictures before the roundup text
  album:
    enabled: false
    minPhotos: 2                        # fewer usable pictures → text only
    maxPhotos: 5
    timeoutSeconds: 3                   # HEAD check per picture
    maxBytes: 5242880

# ── Footer badges: global knobs ──────────────────────────────────
# Which badges a category shows: `post.badges`. Lookups run under this budget, cached in the DB.
badges:
  timeoutSeconds: 5                     # per provider, per bullet
  maxTotalSeconds: 15                   # per digest
  githubToken: ""                       # env GITHUB_TOKEN wins; 5000 req/h instead of 60
  steamCountry: "UA"                    # store region → prices in that currency
  steamLanguage: "ukrainian"
  trailerEventTypes: [major_announcement, release_date, major_dlc_expansion, delay]   # ▶️
  trailerFetchOnDelivery: true          # ▶️ may fetch the article page when the feed had no video
  ukLocalizationShowMissing: false      # 🇺🇦 also post "Без української"
  openCriticKey: ""                     # 🏆 RapidAPI key (env OPENCRITIC_RAPIDAPI_KEY); "" = Metacritic only
  nvdApiKey: ""                         # 🛡 env NVD_API_KEY; 50 instead of 5 requests / 30 s
  steamTrendTopN: 25                    # 📈 chart places counted (1..100)
  hnMinPoints: 10                       # 🔥 no HN badge below this many points
  githubMinStars: 50                    # ⭐ no GitHub badge below this many stars

# ── telegra.ph account ───────────────────────────────────────────
# For post.longForm.telegraph. Without a token the bot creates an account once and keeps it in the DB.
telegraph:
  accessToken: ""                       # env TELEGRAPH_TOKEN wins
  shortName: "RssNewsBot"               # 1..32 chars
  authorName: "RSS News"
  authorUrl: ""                         # "" = the channel link (public @username channels)
  timeoutSeconds: 10                    # per API call; on failure the post goes out without a page

# ── Reaction feedback ────────────────────────────────────────────
# Rolls reactions (needs telegram.updatesPolling) into audience affinity per franchise / event type /
# subject / source (audience_affinity, /status). Read by ranker.reactionWeight and antiBubble.
feedback:
  enabled: false
  attributionHours: 36                  # posts younger than this are too fresh to learn from
  lookbackDays: 90                      # covered_events retention is stretched to this while enabled
  halflifeDays: 45                      # time-decay half-life of a post's contribution
  minSamples: 3.0                       # keys with fewer (decayed) posts get no score
  shrinkageK: 5.0                       # pseudo-count: scores shrink to the category mean
  minVolume: 1                          # reactions a post needs before its tone counts; raise for a real audience
  recomputeHours: 12
  explicitWeight: 3.0                   # one 👍/👎 moderation press = this many reactions
  valence: {}                           # per-emoji overrides (-1.0..1.0), e.g. { "🤡": 1.0, "custom:5368742036018122275": 0.75 }

# ── Global mute ──────────────────────────────────────────────────
# Articles matching a key are dropped before Step 1, in EVERY category. Whole-word, case-insensitive,
# title + description ("cod" ≠ "code"). Prefer multi-word keys; put risky short ones in a category mute:.
preferences:
  mute: []                              # e.g. [call of duty, black ops, warzone, palworld]

# ── Admin chat ───────────────────────────────────────────────────
# statusChatId alone = the rolling /status snapshot. Use the PRIVATE chat with the bot (id = your user
# id): commands and buttons do not work in a channel. Commands, mute proposals and moderation need
# telegram.updatesPolling. Commands: README → "Admin commands".
admin:
  statusChatId: null                    # e.g. "123456789"; null = no status post
  userIds: []                           # who may run commands / press buttons, e.g. [123456789]
  commands:
    enabled: false                      # /help /status /pause /resume /run /mute /unmute /mutes /inspect /raw /thread
  muteSuggestions:                      # weekly "mute this?" with [in category] [global] [no]
    enabled: false
    everyDays: 7
    maxScore: -0.15                     # franchises at or below this affinity (needs feedback)…
    minTone: 2.0                        #   …over at least this many reacted posts
    minRejected: 20                     # …or rejected by Step 1 this often, never posted
    maxPerRun: 5
  moderation:                           # per published post: [🗑 delete] [🔇 mute] [👍 more] [👎 less]
    enabled: false
    categories: []                      # empty = every category
  inspect:                              # /inspect <post link>, a pasted link or a forwarded post → a card + 🔇 buttons
    enabled: true                       # only with commands.enabled; false = no /inspect, links/forwards ignored
  threads:                              # topics of statusChatId (@BotFather → Threaded Mode); /thread prints an id
    status: null                        # status snapshot, alerts, mute proposals, moderation; null = main thread
    inspect: null                       # /inspect cards
    raw: null                           # /raw: category → feed → its 10 latest articles

categories:
  tech:
    emoji: "💻"
    channelId: "@my_tech_channel"       # public @username or "-1001234567890" for a private channel
    feeds:
      - https://hnrss.org/newest?points=120
      - https://techcrunch.com/feed/
      # Platform feeds. kind: article | social | release | video (unset = ordinary feed).
      # RSSHub routes (http://<rsshub>/telegram/channel/<name>) are kind: social too.
      - url: https://mastodon.social/@Mastodon.rss
        kind: social
        label: "Mastodon"               # name in /status 📡 Feeds and the Step 1 source hint
        minTextChars: 40                # skip shorter items ("🔥", "Анонс!")
        repointLinks: true              # a short post with ONE article link becomes that article
      - url: https://github.com/ollama/ollama/releases.atom
        kind: release
        titlePrefix: "Ollama "          # "v0.12.3" → "Ollama v0.12.3"
        exclude: ["-rc", "-beta", "nightly"]   # skip titles containing these
      - { url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCLA_DiR1FfKNvjuUpBHmylQ", kind: video, label: "NASA" }

  gaming:
    emoji: "🎮"
    channelId: "@my_gaming_channel"
    mute: []                            # keys muted in THIS channel only (merged with preferences.mute), e.g. [cod]
    enableImages: true                  # photo + caption when the article has an image
    skipBatch: false                    # true = never a Batch API (CLI-only category); conflicts with llm.batch / batch: true
    intervalMinutes: null               # digest cadence, e.g. 15; null = scheduler.intervalMinutes
    fetchIntervalMinutes: null          # ingestion cadence, e.g. 10; null = fetcher.intervalMinutes
    # Presentation of the posts; touches only the text sent to Telegram.
    post:
      # meaningful_update → a reply to the previous post about the story
      threads:
        enabled: true
        maxAgeDays: 30                  # don't reply to older posts
      # Hashtag line: static tags + tags from Step 1 fields
      hashtags:
        category: "#gaming"             # static, space-separated
        fromFranchise: true             # #silksong
        fromEventType: false            # #release_date
        fromSubject: false              # tech subjects are free text, off
        max: 3                          # generated tags per bullet
      # Live-data badge lines (budget: top-level badges:)
      badges:
        steam: true                     # 🎮 Steam: ₴899 (−20%) · 92% позитивних (12 345) · реліз …
        ukLocalization: false           # 🇺🇦 Українська: інтерфейс і субтитри, без озвучки
        deck: false                     # 🕹 Steam Deck: ✅ перевірено · ProtonDB: Platinum
        critic: false                   # 🏆 Metacritic: 90 (+ OpenCritic with badges.openCriticKey)
        steamTrend: false               # 📈 Steam: №4 у хітах продажу
        hn: false                       # 🔥 HN: 512 · 340 коментарів (hnrss.org feeds)
        github: false                   # ⭐ GitHub: 12.3k · Rust (repository links)
        trailer: false                  # ▶️ Трейлер (YouTube video the article embeds)
        cve: false                      # 🛡 CVE-2021-44228: CVSS 10.0, критична (tech)
      # 📚 Team Cherry: австралійська студія відеоігор · Вікіпедія — first mention of a name
      intro:
        enabled: true
        languages: [uk]                 # Wikipedia languages, in order
        maxPerDigest: 2
        repeatAfterDays: 365
        # An article counts only when its title / description / opening has one of these words
        # (so the game Rust is not the programming language); [] = no check. Default shown.
        topicWords: [відеогр, "комп'ютерн", ігор, "гра ", "гру ", ігрова, ігрове, розробник, видав, студі,
                     video game, videogame, game developer, game publisher, developer, publisher, studio,
                     franchise, role-playing game, mmorpg, esports]
      # Two-paragraph posts for the top events, written from the refetched article. The render
      # prompt must know `depth` (LONG-FORM ITEMS in prompts/games-dedup.example.yaml).
      longForm:
        enabled: true
        maxPerDigest: 1
        minComposite: 8.0               # ranker composite score (0..10) an event needs
        sourceChars: 5000               # article text passed to the render
        # ⚡ also a telegra.ph Instant View page (account: top-level telegraph:). Public, undeletable.
        telegraph:
          enabled: false
          mode: teaser                  # teaser = lead paragraph + ⚡ link; full = whole post + ⚡ link;
                                        # link = only the page's Instant View card, no text
      # ── Story lines ── facts about the story, no LLM (need storyIntel.enabled)
      storyLines:
        hype:                           # 📢 9 видань · 1 першоджерело
          enabled: false
          minOutlets: 4                 # show from this many distinct outlets
          reprintSimilarity: 0.95       # cosine at which an article counts as a copy
        first:                          # 🥇 першим був insider-gaming.com (+2 год)
          enabled: false
          minOutlets: 3
          minLeadMinutes: 30            # smaller lead over the second outlet = a tie, no line
        conflicts:                      # ⚖️ Джерела розходяться: дата 14.10 (ign.com) чи 21.10 (pcgamer.com)
          enabled: false
          mode: log                     # log = only [StoryConflict] in the log; post = footer line
          minSupport: 1                 # outlets that must state a value; 2 with mode: post
          dateToleranceDays: 1
        vaporware:                      # 🌀 анонсовано вчетверте, дати досі немає
          enabled: false
          announceTypes: [major_announcement, rumor, leak, dev_quote]
          minAnnouncements: 3           # show from the Nth announcement
          minGapDays: 30                # silence that makes the next one a new announcement
          softDatesStop: false          # true = a year / quarter date also stops the count
      # ── 📰 Також: [IGN](…) · [PC Gamer](…) ── other outlets folded into the story
      also:
        enabled: false
        logOnly: true                   # first week: only [Also] in the log
        max: 3
        names: { ign.com: IGN, pcgamer.com: PC Gamer, eurogamer.net: Eurogamer }   # else feed label / domain
      # ── Official sources first ── link the press release when it is in the story's cluster (needs dedup:)
      official:
        enabled: false
        domains: [blog.playstation.com, news.xbox.com, nintendo.com, steampowered.com, ea.com, ubisoft.com]
        matchEntityDomain: false        # true = also hollowknight.com for "Hollow Knight"
      # ── Better pictures ── no logos / avatars / pixels (needs enableImages)
      images:
        enabled: false
        ogFirst: true                   # the article's og:image first
        fromCluster: true               # else pictures of the story's other articles
        minWidth: 400
        probe: false                    # true = measure pictures without a declared size
        ignore: []                      # URL substrings to skip, e.g. ["default-og.png"]
        timeoutSeconds: 5               # per page
        maxTotalSeconds: 20             # per digest
      # ── 🔗 У 🖥 Tech: [<subject>](t.me/…) ── the story's post in another channel
      #    (needs semanticDedup.eventEnabled here and in every listed category)
      crossLinks:
        enabled: false
        categories: [tech]
        minSimilarity: 0.82
        maxAgeDays: 3
        logOnly: true                   # first: only [CrossLink] in the log, to tune minSimilarity
      # ── 💬 Editor persona ── one remark under the top event, A/B against none (/status 🧪 Variants);
      #    one extra LLM call per digest (llm.persona)
      persona:
        enabled: false
        promptFile: "prompts/persona-gaming.yaml"   # required: copy prompts/persona.example.yaml
        share: 0.5                      # share of digests that get the remark
        maxChars: 160
        timeoutSeconds: 60
        bannedPhrases: ["це важливо", "варто звернути увагу", "чому це цікаво",
                        "як редактор", "як штучний інтелект"]
    # Pinned message kept up to date from this category's events (needs dedup: and eventDate in the
    # extract prompt):  📅 Найближчі релізи · 14.10.2026 · Hollow Knight: Silksong …
    trackers:
      - id: releases
        title: "📅 Найближчі релізи"
        eventTypes: [release_date, delay]
        horizonDays: 120
        maxEntries: 20
        pinned: true                    # needs the bot's "edit messages" right in the channel
        releasedRetentionDays: 7
        showUndated: false              # true = list TBA entries too
    feeds:
      - https://kotaku.com/feed
    # Per-use-case provider + model (provider = a top-level block). Omitted slots use the defaults.
    # Any slot may instead be a weighted split: `providers:` entries with a `percent` (sum 100);
    # the day's calls follow the shares, tallies survive a restart and reset at local midnight.
    # An entry without `model` on openrouter = the openrouter.models ladder.
    # README → "LLM routing" explains each slot, the split, fallback and batch.
    llm:
      extract:                          # was extract + extractAlternate (A/B): now a 50/50 split
        providers:
          - { percent: 50, provider: openai,    model: gpt-5-mini-2025-08-07 }
          - { percent: 50, provider: anthropic, model: claude-haiku-4-5-20251001, batch: true }
      render:           { provider: openrouter, model: x-ai/grok-4,
                          fallback: { provider: anthropic, model: claude-haiku-4-5-20251001 } }  # on failure only
      batch:            { provider: openai,     model: gpt-5-mini-2025-08-07 }                   # openai | anthropic
      summarize:                        # used by feeds with `summarize: auto`; a feed naming a provider stays on it
        providers:
          - { percent: 20, provider: openai,     model: gpt-5-mini-2025-08-07 }
          - { percent: 10, provider: anthropic,  model: claude-haiku-4-5-20251001 }
          - { percent: 70, provider: openrouter }                                             # models: ladder
      batchFallback:    { provider: anthropic,  model: claude-haiku-4-5-20251001 }               # sync, under backpressure
      persona:          { provider: openrouter, model: "provider/your-free-model" }              # post.persona remark
      updateDiff:       { provider: openrouter, model: "provider/your-free-model" }              # dedup.digest.updateDiff check
      # 🌓 Shadow: B gets exactly A's input, only A is posted, both stored in shadow_runs
      #    (node bench/shadow-dump.mjs). Needs dedup:.
      shadow:
        enabled: false
        extract: { provider: openrouter, model: "minimax/minimax-m3:free" }   # null = no Step 1 B
        render:  { provider: claudecli, model: claude-sonnet-4-6 }            # null = no render B
        promptFile: null                # null = A's prompts; e.g. "prompts/games-dedup.shadow.yaml"
        sampleRate: 1.0                 # share of A's calls that get a B run (lower it for a CLI B)
        queueSize: 4                    # B runs waiting per category; more are dropped
    # Two-step pipeline: Step 1 extracts events and shortlists new ones, Step 2 renders the shortlist.
    # Without dedup: the category uses the legacy single-step flow.
    dedup:
      promptFile: "prompts/games-dedup.example.yaml"   # copy to prompts/games-dedup.yaml to customise
      prompts:                          # inline text beats promptFile; "" = not set
        extractSystem: ""
        extractUser: ""
        renderSystem: ""
        renderUser: ""
      contextDays: 7                    # days of covered events shown to Step 1
      maxContextEvents: 200
      extractMaxArticles: 100           # newest articles per Step 1 call; ~40 for a CLI extract
      extractMaxPromptChars: 80000      # char budget of the article batch; the rest waits
      digest:
        ranker:
          enabled: true
          newsworthinessWeight: 0.6     # digestFit weight is (1 - this)
          reactionWeight: 0.0           # audience-affinity term, e.g. 0.15 (needs feedback.enabled)
          reactionLogOnly: true         # true = log [AffinityRank][LOG-ONLY], publish the baseline
          maxAffinityBoost: 1.0         # max composite points affinity may move one item
        minStrongItems: 4               # skip publish if fewer strong items survive
        maxDigestItems: 6
        maxWaitHours: 4                 # no digest this long → relax minStrongItems…
        minItemsOnForcePublish: 2       # …down to this
        maxPerFranchise: 2
        maxPerSubject: 1
        minDigestFit: 3                 # drop items below this digestFit…
        newsworthinessOverride: 8       # …unless newsworthiness >= this
        meaningfulUpdateCooldownMinutes: 90
        breakingNewsworthiness: null    # e.g. 9: an item this newsworthy skips the hold-back; null = off
        maxPostsPerEvent: null          # e.g. 2: cap on posts about one story in updateWindowDays; null = off
        updateWindowDays: 7
        # 🧭 Anti-bubble: once per intervalDays an important event outside the channel's usual taste
        #    (needs ranker.enabled and feedback.enabled)
        antiBubble:
          enabled: false
          intervalDays: 7
          minNewsworthiness: 8          # only this important or more
          maxAffinity: -0.05            # only this far outside the audience's taste or more
          label: "🧭 Поза звичним вибором"
        # 🔁 Update diff: a meaningful_update goes out only with facts the earlier posts of the story lack
        #    (one LLM call per update, llm.updateDiff; the render prompt needs the newFacts rule)
        updateDiff:
          enabled: false
          logOnly: true                 # true = log [UpdateDiff][LOG-ONLY], post as before
          maxPreviousPosts: 3           # earlier posts of the story the model compares against
          windowDays: 14
          timeoutSeconds: 60            # no answer in time → the update is kept as is
          maxSourceChars: 4000          # source-article text of the update

  politics:
    emoji: "🏛️"
    channelId: "@my_politics_channel"
    summarizePrompt: null               # system prompt for feeds with summarize:; null = built-in
    # Embedding dedup (text-embedding-3-small, ~$0.02/1M tokens). Thresholds are cosine.
    semanticDedup:
      enabled: true                     # article level: [SemanticDedup][HIT] log lines
      model: "text-embedding-3-small"
      windowDays: 14
      threshold: 0.75                   # ≥ this → [HIT] in the log
      topK: 5
      maxRecent: 2000                   # recent vectors loaded per run
      hardThreshold: 0.78               # ≥ this AND the neighbour already sent → DUPLICATE; null = log only
                                        # (suggested: gaming / tech 0.85, politics 0.78)
      eventEnabled: true                # event level after Step 1: [EventSemanticDedup][HIT]
      eventThreshold: 0.75              # ≥ this → [EventSemanticDedup][HIT] in the log
      eventHardThreshold: 0.80          # ≥ this drops a "new" event before render; null = log only
    feeds:
      - url: https://www.pravda.com.ua/rss/
        label: "Українська правда"
        fetchFullContent: false         # true = fetch the article body before summarizing
        summarize: ""                   # per-article summary: auto (= llm.summarize) | openai | openrouter | anthropic | claudecli | codexcli; "" = RSS text
