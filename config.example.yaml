telegram:
  # Set via env var TELEGRAM_BOT_TOKEN or replace the placeholder below
  botToken: "YOUR_TELEGRAM_BOT_TOKEN"
  # Start the getUpdates long-poll loop that records channel-post reactions (👍/👎 …) into
  # `reaction_counts`, surfaced in the /status "Reactions (7d)" section. Off by default.
  # IMPORTANT: Telegram allows only ONE getUpdates consumer per bot token, and the bot must be
  # an admin of each channel. Never enable this on two instances sharing the same token (e.g. a
  # dev box and the production server) — the second one gets an HTTP 409 conflict.
  updatesPolling: false

openai:
  # Set via env var OPENAI_API_KEY or replace the placeholder below
  apiKey: "YOUR_OPENAI_API_KEY"
  model: "gpt-5-mini-2025-08-07"
  batchModel: "gpt-5-mini-2025-08-07"

# Optional OpenRouter provider.
# Generic sync summarize/render paths switch to OpenRouter when this block is present.
# Step 1 `eventExtractor` also sends every 2nd request here, so you can A/B test a free model.
# The Batch API always stays on the `openai:` block above — OpenRouter has no compatible Batch API.
openrouter:
  # Set via env var OPENROUTER_API_KEY or replace the placeholder below
  apiKey: "YOUR_OPENROUTER_API_KEY"
  model: "provider/your-free-model"      # prefixed model name, e.g. some-provider/free-tier-model
  # Optional priority ladder for free-tier flakiness. When `models` is set it REPLACES
  # `model`: every sync call (summarize / render / extract-alternate on the global default)
  # tries the first entry and walks down on failure — provider error, dead endpoint,
  # exhausted retries. Max 4 entries, no duplicates or blanks. `/status` still attributes
  # each call to the model that actually answered. A per-category `llm.*` override that
  # pins provider+model bypasses the ladder deliberately.
  # models:
  #   - nvidia/nemotron-3-ultra-550b-a55b:free
  #   - minimax/minimax-m3:free
  #   - dots-studio/dots-3-note-preview:free
  baseUrl: "https://openrouter.ai/api/v1" # optional; this is the default
  httpReferer: "https://github.com/your/repo"  # optional attribution header
  xTitle: "RssNewsBot"                        # optional attribution header

# Optional Anthropic provider.
# When this block is present, categories may opt into Anthropic for any LLM use case
# (extract / render / batch / summarize / batchFallback) via per-category `llm.*` overrides,
# and feeds may declare `summarize: anthropic`. Unlike OpenRouter, Anthropic exposes a native
# Message Batches API, so `batch` and `batchFallback` overrides BOTH support provider: anthropic.
anthropic:
  # Set via env var ANTHROPIC_API_KEY or replace the placeholder below
  apiKey: "YOUR_ANTHROPIC_API_KEY"
  model: "claude-sonnet-4-6"               # default sync model
  batchModel: "claude-sonnet-4-6"          # default batch model (defaults to `model` when omitted)
  baseUrl: "https://api.anthropic.com/v1"  # optional; this is the default
  anthropicVersion: "2023-06-01"           # optional; required Anthropic-Version header
  maxTokens: 4096                          # optional; per-request output cap

# Optional Claude CLI provider — shells out to the local `claude -p` (Claude Code print mode).
# There is NO apiKey: the subprocess authenticates with the machine's existing `claude` login
# (Pro/Max subscription or whatever the CLI is configured with), so this can be far cheaper than
# per-token API billing. When present, categories may opt in for any SYNC use case
# (extract / extractAlternate / render / summarize / batchFallback) via `llm.*` overrides
# (use `provider: claudecli`), and feeds may declare `summarize: claudecli`. There is no Batch
# API for a CLI, so `llm.batch: claudecli` (and `batch: true` on extract) is rejected at load time.
# Requires the `claude` binary to be installed, on PATH, and logged in.
# claudeCli:
#   command: "claude"      # executable name or absolute path; must be on PATH
#   model: ""              # blank = let the CLI pick its default model; or e.g. "claude-sonnet-4-6"
#   timeoutSeconds: 300    # force-kill ceiling for a single invocation
#
# Example category usage (model may be left blank to use the CLI default):
#   llm:
#     render:    { provider: claudecli, model: "" }
#     summarize: { provider: claudecli, model: claude-sonnet-4-6 }
# …or per feed:  - { url: https://example.com/feed, summarize: claudecli }

# Optional Codex CLI provider — shells out to the local `codex exec` (OpenAI Codex non-interactive
# mode). There is NO apiKey: the subprocess authenticates with the machine's existing `codex` login
# (ChatGPT subscription or whatever the CLI is configured with), so this can be far cheaper than
# per-token API billing. When present, categories may opt in for any SYNC use case
# (extract / extractAlternate / render / summarize / batchFallback) via `llm.*` overrides
# (use `provider: codexcli`), and feeds may declare `summarize: codexcli`. There is no Batch
# API for a CLI, so `llm.batch: codexcli` (and `batch: true` on extract) is rejected at load time.
# The system prompt is passed via codex's `model_instructions_file` config key and the final answer
# is read from `--output-last-message`. Requires the `codex` binary installed, on PATH, and logged in.
# codexCli:
#   command: "codex"       # executable name or absolute path; must be on PATH
#   model: ""              # blank = let the CLI pick its default model; or e.g. "gpt-5-codex"
#   timeoutSeconds: 300    # force-kill ceiling for a single invocation
#
# Example category usage (model may be left blank to use the CLI default):
#   llm:
#     render:    { provider: codexcli, model: "" }
#     summarize: { provider: codexcli, model: gpt-5-codex }
# …or per feed:  - { url: https://example.com/feed, summarize: codexcli }

# Optional: `claude` / `codex` login health (off by default). Every real CLI run reports its
# outcome; an expired login, a subscription limit or an unavailable model — and the recovery —
# each send ONE message to admin.statusChatId (required), even when a `fallback` provider saved
# the call. `/status` gets a `CLI: claude ✅ 2h · codex ⛔ auth з 03:10` line. The idle probe
# pings a CLI with no successful run in `intervalHours` (codex: `codex login status` first when
# the installed version has it). Run the bot as the same user / HOME as the CLIs were logged in.
# health:
#   enabled: true
#   cliProbe: { enabled: true, intervalHours: 6, timeoutSeconds: 60, claudeModel: "", codexModel: "" }
#   claudeTokenExpires: "2027-08-01"  # only for a `claude setup-token` login; warns daily from…
#   warnDaysBefore: 14                # …this many days before

# Optional: per-feed quality metrics (off by default). Every article already records the feed that
# brought it (`articles.feed_url`, `fetched_at`); this adds per-feed fetch health (`feed_stats`,
# flushed on the maintenance tick) and a `📡 Feeds` section in /status that lists only anomalies:
# 💀 dead (no fetch success for deadDays / deadFailStreak failed passes), 💤 nothing new for
# staleNewDays, 🗑 noisy (≥ noisyMinArticles, < noisyMaxPublishedPct published, > noisyMinJunkPct
# junk), 🪞 mirror (first in < mirrorMaxFirstPct of its published stories). Suggestions only — no
# feed is ever disabled. The full per-feed table: `node bench/db-audit/report.mjs logs/news.db`.
# feedHealth:
#   enabled: true
#   windowDays: 14          # by fetched_at; max 30 (rejected_events retention)
#   statusSection: true
#   thresholds: { deadDays: 3, deadFailStreak: 10, staleNewDays: 14, noisyMinArticles: 30,
#                 noisyMaxPublishedPct: 2, noisyMinJunkPct: 80, minPublishedForFirst: 5,
#                 mirrorMaxFirstPct: 10, primaryMinFirstPct: 50 }
#   # Candidate new feeds (independent of `enabled`): domains the channel keeps publishing from
#   # (via reddit / hnrss / the converter) with no configured feed on them; every `everyDays` the
#   # best few get feed autodiscovery (<link rel=alternate>, /feed, /rss, …; public hosts only).
#   # Results: feed_candidates table + log; the static report shows them as "Кандидати". The bot
#   # never adds a feed. Network: ≤ maxProbesPerRun hosts and ≤ maxRequestsPerRun requests a run.
#   candidates:
#     enabled: true
#     everyDays: 7
#     maxProbesPerRun: 10
#     maxRequestsPerRun: 40
#     minPublished: 3        # published links in windowDays
#     recheckDays: 30
#     ignoreDomains: [youtube.com, x.com, twitter.com, reddit.com, t.me, wikipedia.org, github.com]

# Optional: story clusters (off by default). Records which articles the dedup folded into which
# event — Step 1 extractions (every status), Layer 2 late reprints (semanticDedup.hardThreshold)
# and Layer 3.5 merges — into `event_articles`, with each article's domain, pub_date and our own
# fetched_at. Recording only: nothing in the channel changes. The story footer lines
# (`post.storyLines`), `weekly.showOutlets` and `weekly.sourceLeaderboard` read these rows, so
# switch this on weeks before them.
# storyIntel:
#   enabled: true
#   retentionDays: 180        # must be >= weekly.lookbackDays
#   historyRetentionDays: 1095 # event_history: one row per delivered event (first appearance),
#                              # read by the 🌀 vaporware line and the weekly barometer
#   domainAliases:            # sister sites / mirrors counted as one outlet
#     eurogamer.de: eurogamer.net

database:
  path: "news.db"

scheduler:
  intervalMinutes: 10      # default digest cadence per category + the maintenance/status tick
  # perCategory: true      # default. false = legacy single global cycle that waits for the
  #                        # slowest category (processing.categoryDeadlineMinutes /
  #                        # maxConcurrentCategories apply only there).
  # Per category: categories.<name>.intervalMinutes overrides the default (e.g. tech 15, science 60).

# Optional: RSS fetch stage tuning. All feeds go through one shared bounded queue.
# fetcher:
#   maxConcurrentFetches: 3   # simultaneous HTTP requests across ALL categories
#   maxAttempts: 3            # tries per feed per run (retryable failures re-enter the queue)
#   retryDelaySeconds: 15     # fallback delay before a retry; a server Retry-After wins
#   fetchDeadlineSeconds: 240 # wall-clock budget for one run's fetch stage; stragglers defer
#   intervalMinutes: 10       # DECOUPLED ingestion: fetch → enrich → summarize → insert runs on
#                             # its own timer at this cadence and the digest run is only
#                             # Step 1 + Step 2. Unset = ingestion inside the digest run.
#                             # Per category: categories.<name>.fetchIntervalMinutes.
#   scrubRulesFile: scrub-rules.yaml  # site-chrome patterns removed from extracted article text
#                             # (login nudges, share bars). Copy scrub-rules.example.yaml and
#                             # fill in your sites; unset = nothing is scrubbed.
#                             # Shape: rules: [{name, regex, host?, dotAll?}]
#   pathScopedThrottleHosts: ["192.168.77.7:1200"]  # a feed converter (RSSHub): throttle each
#                             # route (/telegram/channel, /twitter/user) on its own, so a 429 from
#                             # one upstream does not cool down every converted feed. Default: [].
#   privateHostAllowlist: ["nas.lan", "192.168.77.7:1201"]  # SSRF guard: extra hosts (`host` =
#                             # any port, `host:port`, or a URL) allowed to resolve to a private /
#                             # loopback / link-local address. The host:port of every feed URL
#                             # above is trusted automatically (a LAN RSSHub needs nothing here);
#                             # every other fetch — article links, repoints, redirects, discovery,
#                             # badges — is refused on a non-public address. Default: [].

# Optional: per-cycle processing knobs.
processing:
  staleTimeoutHours: 3
  minArticles: 15
  # Three-tier batch routing thresholds (per category, driven by pending batch count):
  #   pending <  primaryMaxPending                          → primary batch (`llm.batch`)
  #   primaryMaxPending ≤ pending < primary + secondary     → `llm.batchFallback` (sync alt LLM, if configured)
  #   pending ≥ primary + secondary                          → sync render fallback (`llm.render`)
  # When a category has no `batchFallback`, the secondary band collapses — sync render fires
  # at primaryMaxPending. Defaults below match the historical hardcoded behaviour.
  # Set primaryMaxPending: 0 to disable the primary render Batch API entirely — every render
  # then goes synchronously (via `llm.batchFallback` if configured, else the sync render client).
  # (The Step-1 extract batch is separate; disable it by using a non-batch extract endpoint.)
  primaryMaxPending: 2     # primary batch capacity before promoting to fallback (0 = batch off)
  secondaryMaxPending: 1   # additional capacity on the fallback before sync render
  # shadowRetentionDays: 30  # how long `llm.shadow` pairs stay in shadow_runs

# Optional: 🧐 LLM fact-check of the sent posts (off by default). After a digest went out, a
# share of its posts goes to a judge model with EXACTLY the source text the render saw (the
# long-form full text included); the judge lists claims the sources do not support. Log-only:
# verdicts land in `fact_checks` and /status (`🧐 Fact-check 7d: …`, plus ⚠️ with links to the
# latest unsupported posts above the threshold) — no post is ever edited, deleted or held back.
# Own thread, never delays delivery; a judge failure is a warning. Posts are Ukrainian and sources
# mostly English, so pick a multilingual judge and give a free model a fallback. Expect false
# alarms on general context at first: review them (bench/factcheck-dump.mjs) and tune the prompt.
# factCheck:
#   enabled: true
#   sampleRate: 0.2                  # share of sent posts that are checked
#   categories: []                   # empty = every category
#   judge: { provider: openrouter, model: "nvidia/nemotron-3-ultra-550b-a55b:free",
#            fallback: { provider: codexcli, model: gpt-5.4-mini } }
#   promptFile: "prompts/factcheck.yaml"   # omit = built-in Ukrainian prompt (see prompts/factcheck.example.yaml)
#   alert: { windowDays: 7, minChecks: 10, maxUnsupportedRate: 0.15 }
#   retentionDays: 90
#   queueSize: 32                    # checks waiting for the judge; more are dropped

# Optional: include previous digest summaries as context to avoid repeating
# already-covered news. Summaries are stored in the database and injected
# into the LLM prompt so it can focus on genuinely new developments.
summaryHistory:
  maxCount: 3          # number of previous digests to include (default: 3)
  retentionDays: 14    # days to keep old summaries in DB (default: 14)

# Optional: retention archive. Instead of deleting rows past their retention window, the cleanup
# copies them into per-period SQLite files (archive/news-archive-2026-09.db, partitioned by the
# ROW's month) and then deletes them from news.db — so benchmarks can train on more than the last
# 30 days. Archived embedding/event rows carry a snapshot of their `articles` rows, so each file
# joins on its own. Size at ~1400 articles/day: `embeddings: all` ≈ 450 MB/month (~5.4 GB/year),
# `labelled` ≈ 250 MB/month. news.db does not shrink by itself: run one manual VACUUM after the
# first archiving pass. Absent or `enabled: false` = plain DELETE, as before.
#archive:
#  enabled: false
#  dir: "archive"            # relative = next to the database file; keep it on LOCAL disk
#  rotation: monthly         # monthly | quarterly | yearly
#  embeddings: labelled      # all | labelled (article reached Step 1) | none (delete without archiving)
#  tables: [article_embeddings, event_embeddings, rejected_events, covered_events,
#           llm_calls, summaries, digest_messages, reaction_counts]
#  keepFiles: 0              # max archive files kept, oldest removed first; 0 = never delete
#  minFreeDiskMb: 2048       # below this free space: warn and fall back to plain DELETE

# Optional: weekly "top story of the week" roundup. When enabled, a dedicated scheduler fires
# once per week at dayOfWeek + time (the bot's local zone). For each participating category it
# ranks the week's covered events by how many times each story was seen — the canonical coverage
# plus every later duplicate detection (the "most duplicates / most repeated = most interesting"
# signal) — merges near-duplicate phrasings via an embedding pass, hands the top candidates to the
# category's render LLM to pick/order/write, and posts the roundup to that category's own channel.
# No schema migration: the signal is read from the existing covered_events / rejected_events tables.
# Categories WITHOUT a `dedup:` block (e.g. a legacy single-step one) have no events, so they fall
# back automatically to ranking the week's raw ARTICLES — clustered by embedding the same way, with
# the wider `articleCandidatePoolSize` so a low-duplication (single-source) category still posts a
# sensible roundup. Off by default — omit the whole block to disable.
weekly:
  enabled: false
  dayOfWeek: SUNDAY        # MONDAY..SUNDAY, case-insensitive
  time: "18:00"            # 24h "HH:mm" in the bot's local time zone
  lookbackDays: 7          # window over which the week's events are gathered
  topN: 5                  # how many stories to feature in the roundup
  candidatePoolSize: 15    # top-by-mention clusters handed to the LLM to choose from (>= topN)
  articleCandidatePoolSize: 40  # candidate pool for the article-level fallback (see note above);
                                # wider than candidatePoolSize so low-duplication categories still
                                # give the LLM a broad weekly sample to pick from (>= topN)
  minMentions: 2           # a story needs at least this many sightings to qualify (falls back to
                           # top-by-newsworthiness if nothing repeated, so a post still goes out)
  clusterThreshold: 0.83   # cosine ≥ this merges two events (different phrasings) into one story
  embeddingModel: "text-embedding-3-small"
  maxEvents: 1000          # cap on event rows scanned per category per run
  showMentions: true       # append a "🔁 N" badge per bullet (N = how many times the story was
                           # seen this week); matched to each bullet by URL, so it's always exact
  showOutlets: false       # needs storyIntel: the badge becomes "📢 N видань · M першоджерел"
                           # over the story's complete clusters (late reprints included);
                           # a story with fewer than two outlets keeps "🔁 N"
  # "🥇 Хто пише першим (30 дн.): a.com — 12 з 20 · …" after the bullets (needs storyIntel):
  # outlets most often first over the story clusters with 3+ outlets of the last lookbackDays,
  # among those with minEvents+ stories. showCopiers adds the outlets most often behind —
  # naming them publicly is a reputational call, hence off. /status shows the same ranking
  # (with these numbers) whenever storyIntel is on.
  # sourceLeaderboard: { enabled: false, lookbackDays: 30, minEvents: 10, top: 3, showCopiers: false }
  # Industry barometer (needs storyIntel — it counts event_history): distinct subjects per ISO
  # week (Mon–Sun, the last bar is the current week) per series over the last `weeks` weeks.
  # format png: a 1200×675 chart (one panel per series, each with its own scale) posted as its
  # own photo right after the roundup (bundled DejaVu font, java.awt headless); if it cannot be
  # drawn, the sparkline text goes into the
  # roundup instead. format text: only the sparkline block, before the hashtag. Nothing until the
  # history spans minWeeks. At most two series. A series matches by eventTypes, or by keywords in
  # the subject of a keywordEventTypes event (default [industry_news]); byEventDate counts a
  # release in the week of its own day date (the latest known per subject) — sparse, since only
  # a minority of release stories carry a day-precise eventDate. Prod prompts may
  # add a `layoffs` event type; the keywords cover rows filed as industry_news.
  # barometer:
  #   enabled: false
  #   categories: [gaming]     # empty = every roundup category
  #   weeks: 12
  #   minWeeks: 4
  #   format: png              # png | text
  #   series:
  #     - { id: layoffs, label: "Звільнення і закриття", eventTypes: [layoffs, studio_closure],
  #         keywords: [звільн, скорочення штату, скорочення співробітників, закриття студії, layoff, laid off, job cuts, studio closure] }
  #     - { id: releases, label: "Новини про релізи", eventTypes: [release_date, delay] }
  # Album before the roundup text (sendMediaGroup): the pictures of the stories the bullets link
  # (their stored feed image, bullet order, one per picture URL, judged by the category's
  # post.images picker when it has one), the header line as the first photo's caption. Each is
  # checked first with a HEAD request (timeoutSeconds, image/…, at most maxBytes) — one bad photo
  # fails the whole album. Fewer than minPhotos usable, or a failed album → the text alone.
  # album: { enabled: false, minPhotos: 2, maxPhotos: 5, timeoutSeconds: 3, maxBytes: 5242880 }
  hashtag: "#головне"      # optional: appended on its own line at the end of the post (omit = none)
  # Which categories participate. Omit/empty = every category that has a `dedup:` block.
  # categories:
  #   - gaming
  #   - tech
  # Optional prompt override. Built-in Ukrainian defaults are used when absent.
  # promptFile: "prompts/weekly.yaml"      # keys: weekly.system / weekly.user
  # prompts:                                # inline beats the file
  #   system: "..."
  #   user: "..."

# Global knobs for the live-data footer badges (which badges a category shows is `post.badges`
# inside the category). Lookups run in the background under this budget, so a slow public API
# never delays a digest; results are cached in the DB (Steam 24h, HN 1h, GitHub 24h, misses too).
# badges:
#   timeoutSeconds: 5        # per provider, per bullet
#   maxTotalSeconds: 15      # per delivered digest; once spent, remaining bullets go out plain
#   githubToken: ""          # optional, env GITHUB_TOKEN wins: 5000 req/h instead of 60
#   steamCountry: "UA"       # store region → prices in that currency
#   steamLanguage: "ukrainian"
#   # ▶️ trailer badge (post.badges.trailer): which Step 1 event types get it, and whether the post
#   # article's page may be fetched at delivery when ingest found no video in the feed item (the
#   # page fetch + YouTube oEmbed check share timeoutSeconds — consider 8 for this badge).
#   trailerEventTypes: [major_announcement, release_date, major_dlc_expansion, delay]
#   trailerFetchOnDelivery: true
#   # 🇺🇦 badge (post.badges.ukLocalization): also post "🇺🇦 Без української" for a Steam game
#   # without Ukrainian (off: for most indie games that line is noise).
#   ukLocalizationShowMissing: false
#   # 🏆 critic badge: OpenCritic next to Metacritic needs a RapidAPI key (OpenCritic's API
#   # answers "API key is required" without one; the free plan allows 25 searches / 200 requests
#   # a day, the bot searches at most 20). Env OPENCRITIC_RAPIDAPI_KEY wins. Empty = Metacritic only.
#   openCriticKey: ""
#   # 🛡 CVE badge (post.badges.cve): NVD allows 5 requests / 30 s without a key, 50 with a free one
#   # (https://nvd.nist.gov/developers/request-an-api-key). Env NVD_API_KEY wins.
#   nvdApiKey: ""
#   # 📈 trend badge (post.badges.steamTrend): a chart rank counts up to this place (1..100).
#   steamTrendTopN: 25

# telegra.ph account for the long-form Instant View pages (post.longForm.telegraph inside a
# category). Token: env TELEGRAPH_TOKEN, else accessToken, else the one stored in bot_state
# (telegraph:token); with none, the bot calls createAccount once (shortName / authorName /
# authorUrl) and stores the token there. authorUrl blank = the channel link (@username channels).
# The token is never logged. timeoutSeconds caps each API call; a failure or timeout sends the
# long post without a page.
# telegraph:
#   accessToken: ""
#   shortName: "RssNewsBot"
#   authorName: "RSS News"
#   authorUrl: ""
#   timeoutSeconds: 10

# Optional: reaction-feedback loop (phase 1 — aggregation only). When enabled, the reactions
# collected by telegram.updatesPolling are periodically rolled up into per-dimension audience
# affinity scores (franchise / event type / subject / source domain) in the audience_affinity
# table, surfaced in the /status snapshot. Nothing reads the scores for selection yet — later
# phases plug them into the shortlist ranker and prompts. Requires telegram.updatesPolling: true
# to actually accumulate reactions. covered_events supplies the dimensions for every reaction,
# so while feedback.enabled is true its retention is stretched to max(summaryHistory.retentionDays,
# lookbackDays) automatically — a 14-day retention used to silently truncate a 90-day lookback and
# throw away ~72% of the collected reactions. Step-1 context stays bounded by dedup.contextDays,
# so the only cost of the longer window is disk.
feedback:
  enabled: false
  attributionHours: 36     # posts younger than this are too fresh to learn from
  lookbackDays: 90         # how far back the aggregation looks (see retention note above)
  halflifeDays: 45         # exponential time-decay half-life for a post's contribution
  minSamples: 3.0          # dimension keys with fewer (decayed) posts than this get no score
  shrinkageK: 5.0          # empirical-Bayes pseudo-count: scores shrink to the category mean
  minVolume: 1             # a post's tone counts only once it has at least this many reactions;
                           # 1 suits a single-reader channel (your own 👍/👎 is the signal),
                           # raise for channels with a real audience
  recomputeHours: 12       # rebuild cadence (checked at the start of each digest cycle)
  explicitWeight: 3.0      # one 👍/👎 moderation press (admin.moderation) = this many reactions
  # Per-emoji valence overrides (-1.0..1.0), merged over the built-in defaults:
  # valence:
  #   "🤡": 1.0            # e.g. an audience that uses 🤡 approvingly
  #   "custom:5368742036018122275": 0.75

# Optional: manual, editor-controlled content preferences — the deterministic counterpart to the
# learned reaction-feedback loop above. Where `feedback` LEARNS soft nudges from reactions (and can
# never override newsworthiness), `preferences` are hard rules you set by hand.
#
# `mute`: a keyword blocklist applied BEFORE Step-1, so matching articles never reach the LLM at all
# (saving tokens) and never appear in a digest. Matching is WHOLE-WORD and case-insensitive against
# each article's title AND description: `cod` matches "CoD" and "CoD: Warzone" but NOT "code" or
# "codex"; a multi-word entry like `call of duty` matches only that phrase. Applies to EVERY category
# (global). Omit the block (or use an empty list) to mute nothing — the default.
# preferences:
#   mute:
#     # Prefer specific multi-word keys — they can't collide with unrelated words. Example: drop all
#     # Call of Duty coverage across every channel.
#     - call of duty
#     - black ops
#     - warzone
#     - modern warfare
#     # Single-word keys are fine when distinctive (word-boundary matching prevents "diablo" ⊄ …):
#     - diablo
#     - palworld
#     # Caveat: short/ambiguous keys are risky here BECAUSE this list is global — e.g. `cod` would
#     # also hit "cod" (the fish) in a science channel, and `lol` would match casual "lol" anywhere.
#     # Use multi-word keys, or scope the risky key to one channel via a category-level `mute:` list
#     # (see the gaming category below) — the two lists are merged per category.

# Optional: the admin chat. `statusChatId` alone enables the rolling /status snapshot (the previous
# one is deleted on every maintenance tick). Prefer the PRIVATE chat with the bot (its id is your
# Telegram user id): in a channel, commands arrive as channel posts without a sender and are ignored.
# admin:
#   statusChatId: "123456789"
#   userIds: [123456789]       # Telegram user ids allowed to run commands and press admin buttons
#   # Admin commands (/help, …) over the same getUpdates poller as reactions — needs
#   # telegram.updatesPolling: true and a non-empty userIds. Accepted from an admin in statusChatId
#   # or in a private chat with the bot; anyone else is ignored silently. The "/" menu is set for
#   # those chats only. A command older than 10 minutes (sent while the bot was down) is refused.
#   #   /status                     snapshot now (the rolling one is left alone)
#   #   /pause <cat> [30m|6h|2d|1w] pause a category's digest (ingestion keeps going; survives a restart)
#   #   /resume <cat>               lift it, shows the queued backlog
#   #   /run <cat> [fetch]          run the digest now, queued on the category's own thread
#   #                               (per-category scheduler only; ignores a pause)
#   #   /mute <word|"phrase"> [cat] add a mute (shows 7-day hits first); /unmute removes bot mutes
#   #   /mutes [yaml]               every mute with its source; `yaml` prints the bot's mutes as a
#   #                               config fragment so you can move them into this file
#   # Mutes added from Telegram live in the DB table admin_mutes ON TOP of the YAML lists (a manual
#   # config sync can't wipe them); they and /pause are only honoured while commands are enabled.
#   commands:
#     enabled: false
#   # Weekly mute proposals (needs commands.enabled + statusChatId): franchises the audience dislikes
#   # (affinity score <= maxScore with >= minTone reacted posts; needs feedback.enabled) or that never
#   # get through Step 1 (>= minRejected rejections and no coverage in 30 days) become keywords
#   # (first " / " segment of the franchise; generic keys like "cod"/"ai" are skipped, and so is a
#   # keyword no title matched in 30 days). Up to maxPerRun silent messages to the admin chat with
#   # [🔇 in <cat>] [🌐 global] [✖ no]; approving writes the same DB mute as /mute. A rejected
#   # keyword is not proposed again for 90 days.
#   muteSuggestions:
#     enabled: false
#     everyDays: 7
#     maxScore: -0.15
#     minTone: 2.0
#     minRejected: 20
#     maxPerRun: 5
#   # Post moderation from THIS (private) chat — never buttons under channel posts, which every
#   # reader would see. After each digest, one silent message per published post:
#   #   🎮 gaming · <title> · post-link   [🗑 delete] [🔇 Mute: <franchise>] [👍 more] [👎 less]
#   # 🗑 asks first, then deletes every chunk of the post (Telegram allows it for 48 h) and its
#   # digest_messages rows; the event stays covered, so it is not posted again. 🔇 asks in-category
#   # or global and writes the same DB mute as /mute. 👍/👎 go to admin_feedback (last press wins,
#   # the same press again clears it) and count as feedback.explicitWeight reactions in the next
#   # affinity recompute — no attributionHours wait; a deleted post counts as a double 👎.
#   # Needs commands.enabled + statusChatId. 20–40 posts a day mean as many messages here; they go
#   # out after the digest on their own thread, spaced 1 s apart, so channel posting never waits.
#   moderation:
#     enabled: false
#     categories: []           # empty = every category

categories:
  tech:
    emoji: "💻"
    channelId: "@my_tech_channel"    # public channel username or "-1001234567890" for private
    feeds:
      - https://hnrss.org/newest?points=120
      - https://techcrunch.com/feed/
  gaming:
    emoji: "🎮"
    channelId: "@my_gaming_channel"
    # Category-scoped keyword mute, MERGED with the global `preferences.mute` above (an article is
    # dropped before Step-1 if it matches EITHER list). Same whole-word, case-insensitive matching.
    # Use it for keys you want gone from THIS channel only — e.g. mute the short/ambiguous `cod`
    # here without risking "cod" (the fish) in a science category.
    # mute:
    #   - cod
    #   - league of legends
    # When true, each bullet is sent as a Telegram photo+caption (single post) if the
    # first linked article has an image extracted from RSS. Defaults to false.
    enableImages: true
    # When true, this category NEVER uses the Batch API — Step 2 render always runs
    # synchronously via `llm.render` (or `llm.batchFallback` if configured). Use it for
    # always-publish-now categories, or one routed through a sync-only provider like the
    # Claude CLI (provider: claudecli). Cannot be combined with llm.batch or `batch: true`
    # on extract/extractAlternate (rejected at load). Defaults to false.
    # skipBatch: true
    # Optional presentation of this category's posts. Everything here touches ONLY the text
    # that goes to Telegram — the stored summary and the reaction-attribution rows keep the
    # clean bullet. Omit the block (or any sub-block) to leave posts exactly as before.
    post:
      # A `meaningful_update` bullet is sent as a Telegram REPLY to the previous post about
      # the same story (found in digest_messages by the item's related/own event key), so the
      # channel shows a quote header that jumps to it — the story reads as a thread.
      threads:
        enabled: true
        maxAgeDays: 30            # don't reply to a post older than this
      # Hashtag line under every bullet: static tags for the category plus tags derived from
      # Step 1's fields (franchise by default; event type and subject opt-in). Tapping a tag in
      # Telegram lists every post of the channel carrying it. A category without `dedup:` gets
      # the static tags only.
      hashtags:
        category: "#gaming"       # static tags, space-separated; each `#` + letters/digits/_
        fromFranchise: true       # e.g. #silksong
        fromEventType: false      # e.g. #release_date (a fixed enum, the most stable tag)
        fromSubject: false        # off by default: tech subjects are free-text that changes every cycle
        max: 3                    # cap on generated (non-static) tags per bullet
      # Live-data badge lines from public APIs (no keys; cached in the DB; each lookup under the
      # `badges:` time budget at the top level, so a slow API never delays a digest):
      #   steam  — 🎮 Steam: ₴899 (−20%) · 92% позитивних (12 345) · реліз … (game events with a subject)
      #   hn     — 🔥 HN: 512 · 340 коментарів (articles that came through an hnrss.org feed)
      #   github — ⭐ GitHub: 12.3k · Rust · оновлено … (when the article link is a repository)
      #   trailer — ▶️ Трейлер: the YouTube video the article embeds (feed item at ingest, else the
      #            page at delivery), only when YouTube oEmbed knows it and its title names the
      #            subject / franchise — a site's promo clip gets nothing. Event types: badges.trailerEventTypes.
      #   ukLocalization — 🇺🇦 Українська: інтерфейс і субтитри, без озвучки (Steam GetItems, same game
      #            events as steam; no line when the game has no Ukrainian, see badges.ukLocalizationShowMissing)
      #   deck   — 🕹 Steam Deck: ✅ перевірено · ProtonDB: Platinum (354 звіти) (Valve's Deck report +
      #            ProtonDB summary, both undocumented; game events as steam plus patch)
      #   steamTrend — 📈 Steam: №4 у хітах продажу · №12 серед найочікуваніших (top badges.steamTrendTopN of
      #            the store's top sellers / most wishlisted / popular upcoming — undocumented store JSON — and
      #            the Web API most-played chart; charts cached 3 h; game events as steam)
      #   critic — 🏆 Metacritic: 90 (the PC Metascore in Steam's appdetails; release / review events of a
      #            game that is out — Steam fills it some days after release; + OpenCritic with badges.openCriticKey)
      #   cve    — 🛡 CVE-2021-44228: CVSS 10.0, критична · експлуатується (CISA KEV) when the bullet or its
      #            articles name a CVE ID (NVD API 2.0, at most 2 IDs; for a tech category; badges.nvdApiKey)
      # The Steam-based badges share one store search + appdetails per game (cached in the DB).
      badges:
        steam: true
        ukLocalization: false
        deck: false
        critic: false
        steamTrend: false
        hn: false
        github: false
        trailer: false
        cve: false
      # One Wikipedia line the FIRST time a franchise (else subject) appears in this category:
      #   📚 Team Cherry: австралійська студія відеоігор · Вікіпедія
      # The page's short description when it has one, else the first sentence of the summary —
      # an encyclopedia fact, not the LLM. Remembered in entity_intros (misses too), so a name is
      # introduced once per repeatAfterDays and an unknown name is not searched every digest.
      intro:
        enabled: true
        languages: [uk]           # Wikipedia languages to try, in order; text is printed as found
        maxPerDigest: 2
        repeatAfterDays: 365
      # Longer posts for the strongest stories. After ranking, the first `maxPerDigest` events
      # whose composite score (newsworthiness/digestFit, weighted as in dedup.digest.ranker)
      # reaches `minComposite` are sent to render with "depth": "long" and the article page
      # refetched (up to `sourceChars`), so the two-paragraph body is written from the article,
      # not padded from the RSS blurb. The render prompt must know `depth` — see the LONG-FORM
      # ITEMS block in prompts/games-dedup.example.yaml. A long post longer than a photo caption
      # (1024 chars) goes out as text with the image as a large preview above it.
      longForm:
        enabled: true
        maxPerDigest: 1
        minComposite: 8.0
        sourceChars: 5000
        # Also publish the long post as a telegra.ph page (picture, every paragraph, «Джерела»,
        # channel link) — Telegram opens it with ⚡ Instant View. mode teaser: the channel post keeps
        # the headline, the first paragraph, `⚡ [Читати повністю](…)`, the source and the footer,
        # with the page as its large preview; full: the post stays as it is plus the ⚡ line. Any
        # Telegraph failure sends the long post as without it. Pages are public and cannot be
        # deleted through the API. Global account settings: `telegraph:` at the top level.
        # telegraph:
        #   mode: teaser             # teaser | full
        # Video transcripts for long posts (idea 20) are deliberately NOT implemented — there is no
        # `transcript:` option. Every keyless way to get a YouTube transcript automates access to
        # YouTube outside its API: the watch page's captionTracks / timedtext URL, the innertube
        # `youtubei/v1/player` endpoint with a spoofed ANDROID/IOS client (what yt-dlp does), or
        # running `yt-dlp --write-auto-subs`. YouTube's Terms of Service forbid automated access
        # except through the API or with YouTube's permission, and the API's captions.download only
        # serves the video owner's own captions (OAuth). Practical risk on top: YouTube answers
        # server IPs with a consent page / "confirm you're not a bot" / PO-token demands and blocks
        # repeat offenders — a blocked prod IP would also break the ▶️ trailer badge (oEmbed) and
        # any YouTube feeds. Keyed transcript APIs cost money and are often scrapers themselves.
        # A transcript is also the author's work: even a licensed source would allow only a
        # retelling in our own words with the video link. Revisit only with a licensed source.
      # Story lines: deterministic facts about the story behind a bullet, read from the story
      # clusters (needs `storyIntel.enabled: true` at the top level). They sit after the badges
      # and the intro, before the hashtags. Off unless listed.
      # storyLines:
      #   # 📢 9 видань · 1 першоджерело — outlets = distinct domains in the cluster; a retelling
      #   # credits another outlet ("via X", "according to X", "як повідомляє X", …) or is a
      #   # near-copy (cosine >= reprintSimilarity, semanticDedup vectors) of an earlier outlet's
      #   # article. When every article credits the same outlet: "усі з посиланням на X".
      #   # At post time the cluster is mostly this digest's batch, hence minOutlets.
      #   hype: { enabled: true, minOutlets: 4, reprintSimilarity: 0.95 }
      #   # 🥇 першим був insider-gaming.com (+2 год) — the outlet with the earliest article (feed
      #   # date, or our fetched_at when the feed date lies in its future), shown from minOutlets
      #   # outlets and a lead >= minLeadMinutes over the second (closer is a tie). With hype on,
      #   # both share one line: 📢 9 видань · 1 першоджерело · 🥇 insider-gaming.com (+2 год)
      #   first: { enabled: true, minOutlets: 3, minLeadMinutes: 30 }
      #   # ⚖️ Джерела розходяться: дата 14.10.2026 (ign.com, eurogamer.net) чи 21.10.2026 (pcgamer.com)
      #   # — dates / prices / head counts read from each article's title + teaser (no LLM) that
      #   # disagree between outlets: each value stated by minSupport+ outlets, dates apart by more
      #   # than dateToleranceDays (Q4 2026 and 14.10.2026 agree), prices / counts by more than 1%;
      #   # an article with several values in a slot (deluxe price, regional dates) is skipped.
      #   # mode: log only writes [StoryConflict] lines (and [StoryConflict][late] for a Layer 2
      #   # reprint that contradicts its cluster) — check them for a week before `post`, which adds
      #   # the footer line; use minSupport: 2 with post.
      #   conflicts: { enabled: true, mode: log, minSupport: 1, dateToleranceDays: 1 }
      #   # 🌀 анонсовано вчетверте, дати досі немає (вперше: 03.2025) — for an undated item of an
      #   # announceTypes type, read from event_history (delivered events, kept for years): the
      #   # undated announcements about the same subject form waves (a gap of minGapDays starts a
      #   # new one); shown from the minAnnouncements-th wave. A day / month date in the history
      #   # means no line; a year / quarter ("2027") stops it only with softDatesStop.
      #   vaporware:
      #     enabled: true
      #     announceTypes: [major_announcement, rumor, leak, dev_quote]
      #     minAnnouncements: 3
      #     minGapDays: 30
      #     softDatesStop: false
      # 📰 Також: [IGN](…) · [PC Gamer](…) — the other outlets of this digest's batch that Step 1
      # folded into the event (its articleIndices + the in-batch duplicates; those copies are never
      # posted on their own). The post's own host is left out, one link per host, at most `max`.
      # Name: `names` by host (ign.com also covers uk.ign.com), else the feed's `label` when the
      # feed lives on that host, else the domain without its TLD (eurogamer.net → Eurogamer).
      # Every event logs `[Also] <eventKey>: N other source(s)`; start with logOnly: true for a
      # week to see how often a batch cluster has more than one outlet. Late reprints that arrive
      # after the post are not added.
      # also:
      #   logOnly: true
      #   max: 3
      #   names: { ign.com: IGN, pcgamer.com: PC Gamer, eurogamer.net: Eurogamer }
      # Official sources first: when the event's batch cluster holds an article on one of
      # `domains` (a listed domain or a subdomain of it), the post links there instead of the
      # outlet Step 1 picked — the image, the long-form source text and covered_events follow;
      # the outlet moves to the 📰 Також line. The first listed domain some article matches
      # wins. matchEntityDomain also accepts a host named after the franchise / subject
      # (hollowknight.com for "Hollow Knight"). Needs a dedup: block. Logs [Official].
      # official:
      #   domains: [blog.playstation.com, news.xbox.com, nintendo.com, steampowered.com, ea.com, ubisoft.com]
      #   matchEntityDomain: false
      # Better pictures (needs enableImages: true). Logos, author avatars, tracking pixels,
      # .svg/.ico, a known width under minWidth or an aspect beyond 4:1 / 1:3 never become the
      # post picture; `ignore` adds URL substrings (a site's branded fallback og:image).
      # At ingest the first ACCEPTABLE feed image is stored (not simply the first one). At
      # delivery: ogFirst fetches the post article's og:image (one page per post, timeoutSeconds
      # each, maxTotalSeconds per digest, cached 7 days), then the stored images of the topic,
      # then with fromCluster those of the event's other batch articles. probe sizes a picture
      # without a declared size from its first 64 KB. Nothing acceptable → a text post.
      # images:
      #   ogFirst: true
      #   fromCluster: true
      #   minWidth: 400
      #   probe: false
      #   ignore: []
      #   timeoutSeconds: 5
      #   maxTotalSeconds: 20
      # 🔗 У 🖥 Tech: [<subject>](https://t.me/…) — the post about the same story that another
      # category's channel already carries: this event's Layer-3.5 vector is compared with the
      # listed categories' event vectors of the last maxAgeDays days (same model only); the best
      # one at cosine >= minSimilarity that actually reached its channel is linked. No LLM, no
      # new embedding call; this category and every listed one need semanticDedup.eventEnabled.
      # A listed category on the same channel is skipped. Logs [CrossLink] <key> ~ tech:<key2>
      # sim=0.84 — start with logOnly: true to calibrate the threshold. t.me/c/… links (numeric
      # channel ids) open only for members of that channel.
      # crossLinks:
      #   categories: [tech]
      #   minSimilarity: 0.82
      #   maxAgeDays: 3
      #   logOnly: true
      # 💬 editor persona: one characterful line under the digest's top event, as an A/B test.
      # The top event's arm is fixed by its key (floorMod(hashCode, 100) < share×100 → persona,
      # else control — no call, no line); both arms are written to digest_messages.variant and
      # /status compares their reactions (🧪 Variants, 30d). One extra LLM call per digest at
      # most (llm.persona, else llm.render, else the sync default; llm_calls use_case PERSONA).
      # A remark over maxChars, with a URL / [ ] # ` ** / a number the topic lacks / a banned
      # phrase, or a failed call (timeoutSeconds) → no line and variant null (out of the test).
      # promptFile is required: copy prompts/persona.example.yaml and write the voice yourself.
      # Needs ≥40 posts per arm (3–4 weeks of gaming) — fix the decision rule before starting.
      # persona:
      #   promptFile: prompts/persona-gaming.yaml
      #   share: 0.5
      #   maxChars: 160
      #   timeoutSeconds: 60
      #   bannedPhrases: ["це важливо", "варто звернути увагу", "чому це цікаво", "як редактор", "як штучний інтелект"]
    # Living pinned messages maintained from this category's events. After every digest the
    # bot upserts one line per shortlisted event of a listed type (keyed by the Step 1 subject,
    # dated by its `eventDate` — see the extraction schema in prompts/games-dedup.example.yaml),
    # re-renders the message and edits it in place only when something changed; a deleted
    # message is posted (and pinned) again. Past-date entries move to a "released this week"
    # section, entries beyond horizonDays are kept but hidden. Requires a dedup: block.
    #   📅 Найближчі релізи · оновлено 12.09 14:30
    #   14.10.2026 · Hollow Knight: Silksong ⏳ було 24.09.2026 · пост
    #   Q1 2027 · GTA VI
    #   TBA · Half-Life 3
    trackers:
      - id: releases
        title: "📅 Найближчі релізи"
        eventTypes: [release_date, delay]
        horizonDays: 120
        maxEntries: 20
        pinned: true              # needs the bot's "edit messages" admin right in the channel
        releasedRetentionDays: 7
        showUndated: false        # true = list TBA entries too; needs eventDate in the prompt to mean anything
    feeds:
      - https://kotaku.com/feed
    # Optional: per-use-case provider+model overrides. The provider name points at one of
    # the top-level blocks (`openai:` / `openrouter:` / `anthropic:` / `claudeCli:`) which
    # carries the credentials/baseUrl (or, for claudecli, the CLI command); the override only
    # swaps the model and (for sync paths) the endpoint.
    # Any key may be omitted — omitted use cases fall back to the global defaults:
    #   extract → openai.model + openrouter.model alternating every 2nd request
    #   extractAlternate → optional explicit "B" side of the Step 1 A/B pair. Requires `extract`
    #     to be set. When both are present, every 2nd extract request is routed here instead of
    #     the auto-derived openrouter default. When only `extract` is set, alternation is
    #     suppressed (legacy behaviour). Setting this without `extract` is rejected at load time.
    #   render  → openrouter.model when openrouter: is set, else openai.model
    #   batch   → openai.batchModel (provider must be 'openai' for now — OpenRouter has no Batch API)
    #   summarize → per-feed `summarize:` provider with that provider's global model
    #   batchFallback → optional sync override; when set AND one batch is already pending for this
    #     category, the next cycle bypasses batch submission and uses this LLM synchronously.
    #     Layered on top of the existing >=2 backpressure logic; any provider is valid here.
    #
    # On-failure `fallback` (nested on any sync slot — extract / extractAlternate / render /
    # summarize / batchFallback):
    #   Add `fallback: { provider, model }` to a slot and, when the primary call FAILS (usage/
    #   credit limit, expired login, bad model, or an exhausted-retry timeout), the SAME call is
    #   retried against the fallback. Sync-only; may chain (depth <= 3); each link must differ
    #   from the others; `batch: true` is rejected on a fallback and on the `batch` slot. This is
    #   distinct from the A/B `extractAlternate` and the backpressure `batchFallback`.
    #
    # `batch` flag on extract / extractAlternate:
    #   Adding `batch: true` to an `extract` or `extractAlternate` entry opts Step 1 into the
    #   provider's Batch API (50 % cheaper, async). The cycle loop is NOT blocked — submit returns
    #   immediately and Step 2 fires later via callback once the batch result arrives. Other
    #   categories in the same cycle proceed normally.
    #   - Requires provider: openai or provider: anthropic (OpenRouter has no Batch API).
    #   - Mixed mode is valid: `extract.batch=true` + `extractAlternate.batch=false` alternates
    #     between cheap async cycles and fast sync cycles. Note: two distinct events can land in
    #     quick succession when a previous async batch completes while a sync cycle is running.
    #   - `batch: true` on render / batch / summarize / batchFallback is silently ignored.
    # Example:
    llm:
      extract:          { provider: openai,     model: gpt-5-mini-2025-08-07 }
      extractAlternate: { provider: anthropic,  model: claude-haiku-4-5-20251001, batch: true }
      render:           { provider: openrouter, model: x-ai/grok-4 }
      batch:            { provider: openai,     model: gpt-5-mini-2025-08-07 }
      summarize:        { provider: openai,     model: gpt-5-mini-2025-08-07 }
      batchFallback:    { provider: anthropic,  model: claude-haiku-4-5-20251001 }
      # persona:        { provider: openrouter, model: … }   # post.persona remark; default: the render route
      # On-failure fallback (nested, sync slots). E.g. primary Claude CLI, fall back to Codex CLI:
      #   render: { provider: claudecli, model: "", fallback: { provider: codexcli, model: "" } }
      # 🌓 Shadow run (needs dedup:): a "B" model and/or prompt gets exactly the input the live
      # "A" gets, in parallel; only A is posted, both land in `shadow_runs` (compare with
      # `node bench/shadow-dump.mjs`, /status shows a 🌓 line). Unlike extractAlternate nothing
      # of B is published and both see the same batch. B's output goes through the same
      # post-processing (Step 1: URL filter / cooldown / cap / ranker without the audience term;
      # render: the URL whitelist); B renders A's shortlist. B runs on its own thread per
      # category; a full queue drops the run. A CLI B doubles that quota's use — lower sampleRate.
      # shadow:
      #   extract: { provider: openrouter, model: "minimax/minimax-m3:free" }   # omit = no Step 1 shadow
      #   render:  { provider: claudecli, model: claude-sonnet-4-6 }            # omit = no render shadow
      #   promptFile: "prompts/games-dedup.shadow.yaml"   # omit = A's prompts (only the model differs)
      #   sampleRate: 1.0                                  # share of A's calls that get a B run
      #   queueSize: 4                                     # B runs waiting per category; more are dropped
    # Optional: this category's own cadences (per-category scheduler mode).
    # intervalMinutes: 15        # digest run every 15 min (default: scheduler.intervalMinutes)
    # fetchIntervalMinutes: 10   # ingestion every 10 min (default: fetcher.intervalMinutes)
    # Optional: two-step dedup pipeline. Step 1 (sync JSON-mode) extracts structured events
    # and shortlists only new/updated ones; Step 2 (Batch API) renders only the shortlist.
    # Remove this block to fall back to the legacy single-step flow.
    dedup:
      # Path to the YAML file with extract + render prompts (relative to the working directory).
      # Copy prompts/games-dedup.example.yaml to prompts/games-dedup.yaml and customise it.
      promptFile: "prompts/games-dedup.yaml"
      # How many days of already-covered events to inject as Step 1 context.
      contextDays: 7
      # Maximum number of covered-event rows embedded in Step 1. Keep under ~150 for cost.
      maxContextEvents: 200
      # Bounds on one Step-1 extract call: the newest articles by pubDate within both budgets go
      # in, the rest stay UNPROCESSED for the next run. Defaults 100 / 80000. For a CLI-backed
      # extract (codex exec / claude -p) ~40 articles keeps the call in the low minutes; prompts
      # above ~110 KB total ran 10–60 min or hit the CLI timeout.
      # extractMaxArticles: 40
      # extractMaxPromptChars: 80000
      # Optional: editorial-quality gate applied AFTER Step 1 and BEFORE Step 2 render.
      # See telegram_posting_improvement_plan.md §4 for rationale. Leave ranker.enabled=false
      # to keep the legacy behaviour (Step 1's raw shortlist is passed straight to render).
      digest:
        ranker:
          enabled: true
          newsworthinessWeight: 0.6     # digestFit weight is (1 - this)
          # Reaction-feedback term (phase 2; requires feedback.enabled). An item's audience
          # affinity (±~0.5, from audience_affinity) adds reactionWeight×10×score composite
          # points, clamped to ±maxAffinityBoost. Roll out in two steps:
          #   1. reactionWeight: 0.15 with reactionLogOnly: true — watch [AffinityRank][LOG-ONLY]
          #      lines for a few cycles (they show exactly what WOULD change and why);
          #   2. flip reactionLogOnly: false — the same lines switch to [APPLIED].
          reactionWeight: 0.0           # 0 = term off (default)
          reactionLogOnly: true         # true = compute + log, but publish the baseline ranking
          maxAffinityBoost: 1.0         # max composite points affinity may move one item
        minStrongItems: 4               # skip publish if fewer strong items survive
        maxDigestItems: 6               # hard cap on final shortlist
        maxWaitHours: 4                 # if no digest for this long, relax minStrongItems
        minItemsOnForcePublish: 2       # minimum used after maxWaitHours has elapsed
        maxPerFranchise: 2              # diversity cap per franchise
        maxPerSubject: 1                # diversity cap per game/subject
        minDigestFit: 3                 # drop items below this digestFit score
        newsworthinessOverride: 8       # …unless their newsworthiness >= this
        meaningfulUpdateCooldownMinutes: 90  # suppress near-immediate follow-ups unless they are truly major
        # Breaking lane: if any post-ranker item scores newsworthiness >= this, the hold-back
        # above (minStrongItems / maxWaitHours / minItemsOnForcePublish) is skipped and the
        # whole shortlist goes out now — a lone top story no longer waits for company.
        # Raw Step 1 score, 1..10; omit to disable. Note the pre-Step-1 `minArticles` gate
        # still applies — lower it per category (`minArticles: 2` next to `emoji:`) if needed.
        # breakingNewsworthiness: 9
        # Hard cap on posts about one story: a meaningful_update is dropped once the channel
        # carries this many posts (original + updates, by the item's own and related event key)
        # within updateWindowDays. No newsworthiness override — the repeats this targets all
        # scored above it. Omit to disable.
        # maxPostsPerEvent: 2
        # updateWindowDays: 7
        # Anti-bubble: at most once per intervalDays, one event the ranker left out (the
        # maxDigestItems / maxPerFranchise caps or the affinity term) is added past maxDigestItems
        # when newsworthiness >= minNewsworthiness and its audience affinity <= maxAffinity — a
        # story that matters but sits outside what the channel usually picks. Never an event under
        # the digestFit floor or one whose subject is already in the digest. The post gets the
        # label line and digest_messages.variant = explore; the interval starts only once it was
        # really sent (bot_state antibubble:<category>). Needs ranker.enabled and feedback.enabled
        # (no affinity rows → nothing picked). Makes sense only where the affinity data has tone
        # variance — gaming on prod; tech / science have 👍 only. Logs [AntiBubble].
        # antiBubble:
        #   intervalDays: 7
        #   minNewsworthiness: 8
        #   maxAffinity: -0.05
        #   label: "🧭 Поза звичним вибором"
      # Optional: inline prompt overrides — any non-null field takes priority over the file.
      # prompts:
      #   extractSystem: "..."
      #   extractUser: "..."
      #   renderSystem: "..."
      #   renderUser: "..."
  politics:
    emoji: "🏛️"
    channelId: "@my_politics_channel"
    # Optional: system prompt for per-article LLM summarization (used by feeds with `summarize:` set).
    # Falls back to a generic built-in default ("Summarize in 3-5 sentences...") when absent.
    # summarizePrompt: "Stisle resume na ukrainskiy v 3-5 rechen, zberihai tsifry ta nazvy."
    #
    # Optional: log-only embedding-based dedup detector. Embeds each new article via
    # OpenAI text-embedding-3-small and brute-force-scans recent vectors in the same
    # category. Above-threshold matches surface in the log as `[SemanticDedup][HIT]`
    # lines — the detector NEVER mutates article state, NEVER filters the digest. Use
    # it to collect real similarity stats on your corpus before deciding the right
    # threshold. Off by default; opt in per category. Cost is ~$0.02/1M tokens.
    semanticDedup:
      enabled: true
      model: "text-embedding-3-small"   # OpenAI embeddings model id
      windowDays: 14                    # lookback window for candidate neighbours
      threshold: 0.92                   # cosine ≥ this → [HIT] marker in the log
      topK: 5                           # log this many nearest neighbours per article
      maxRecent: 2000                   # cap on recent vectors loaded per cycle per category
      # Optional log-only EVENT-level pass (Layer 3.5). Runs AFTER Step 1 event extraction:
      # embeds each shortlisted event (subject + coreFact) by `event_key` and brute-force
      # cosine-scans recently-covered events in the same category. Surfaces
      # `[EventSemanticDedup][HIT]` lines when cosine >= eventThreshold. Log-only until you set
      # eventHardThreshold below (calibrate eventThreshold first, like the article-level pass
      # above). Reuses model/windowDays/topK/maxRecent. Off by default.
      eventEnabled: true
      eventThreshold: 0.92              # cosine ≥ this → [EventSemanticDedup][HIT] in the log
      # Optional event-level hard filter. When set, a shortlist event with status=="new" whose
      # top covered-event cosine ≥ this is DROPPED before Step 2 renders (logged
      # `[EventSemanticDedup][REJECT]`). meaningful_update follow-ups are never dropped.
      # Cosine-only, per-category — there is deliberately NO subject gate: tech subjects are
      # free-text and rephrased each cycle, so subject equality would gut recall (a week of logs
      # showed gaming 65% / tech 7% same-subject among hits). Must be ≥ eventThreshold.
      # Suggested ~0.80 (precision ~100% there). Leave unset to stay log-only.
      eventHardThreshold: 0.80
      # Optional hard-filter: when set, a new article whose top-1 neighbour is already in
      # status PROCESSED (i.e. was sent to Telegram in a previous digest) AND whose cosine
      # meets `hardThreshold` is marked DUPLICATE (with `duplicate_of` pointing at the
      # canonical row) and skipped before the LLM ever sees it. Matches against UNPROCESSED
      # or PROCESSING neighbours are NOT rejected — the Step 1 event extractor still owns
      # within-batch dedup of unsent articles. Leave null to keep detector log-only.
      # Must be >= `threshold`. Suggested production values from the stat-collection phase:
      #   gaming / tech: 0.85
      #   politics:      0.78
      hardThreshold: 0.85
    feeds:
      # Plain-string form: just the URL, no extras.
      - https://www.pravda.com.ua/rss/
      # Object form: enable per-article LLM summary using the OpenRouter provider.
      # The summary is stored on the `articles.summary` column and used in place of the
      # raw RSS description for downstream digest prompts.
      # - url: https://example.com/feed
      #   fetchFullContent: true       # optional: fetch the full article body before summarizing
      #   summarize: openrouter         # one of: openai | openrouter
      #   label: "Example News"         # optional: name in the /status 📡 Feeds section and the report
      #
      # Feeds a converter (self-hosted RSSHub) or a platform produces. `kind` (article | social |
      # release | video; unset = an ordinary feed, unchanged) derives a title from the post's first
      # line when an item has none (Mastodon, Bluesky), reads YouTube's media:group thumbnail, and
      # for `social` replaces a title that only repeats the post (RSSHub). social / release / video
      # items reach Step 1 with a `source` hint ("official account: <label>").
      # - url: http://192.168.77.7:1200/telegram/channel/some_studio/includeFwd=0&includeServiceMsg=0
      #   kind: social
      #   label: "Some Studio TG"
      #   minTextChars: 40      # shorter items (a sticker, "🔥", "Анонс!") are not ingested
      #   repointLinks: true    # a short post with ONE outbound article link becomes that article
      #                         # (like a reddit link post); the post URL stays in the article meta
      # - url: https://github.com/ollama/ollama/releases.atom
      #   kind: release
      #   titlePrefix: "Ollama "              # "v0.12.3" → "Ollama v0.12.3"
      #   exclude: ["-rc", "-beta", "nightly"]  # title substrings (case-insensitive) not ingested
      # - url: https://www.youtube.com/feeds/videos.xml?channel_id=UCLA_DiR1FfKNvjuUpBHmylQ
      #   kind: video
      #   label: "NASA"
      # - { url: "https://mastodon.gamedev.place/@some_studio.rss", kind: social, label: "Some Studio" }
